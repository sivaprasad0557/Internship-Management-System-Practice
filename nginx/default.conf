server {
    listen 80;
    server_name _;

    location = /users {
        return 301 /users/;
    }

    location /users/ {
        proxy_pass http://user-service:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /products {
        return 301 /products/;
    }

    location /products/ {
        proxy_pass http://product-service:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /orders {
        return 301 /orders/;
    }

    location /orders/ {
        proxy_pass http://order-service:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
